<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locomotion Data Analysis Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #3498db;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            padding: 30px;
            background: white;
            border-bottom: 1px solid #ecf0f1;
        }

        .filter-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group label {
            font-weight: 600;
            color: #2c3e50;
        }

        .filter-group select, .filter-group input {
            padding: 10px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .filter-group select:focus, .filter-group input:focus {
            outline: none;
            border-color: #3498db;
        }

        .charts-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .chart-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .timeline-section {
            padding: 30px;
            background: white;
        }

        .timeline-container {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ecf0f1;
            border-radius: 8px;
            padding: 20px;
        }

        .timeline-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #3498db;
            transition: all 0.3s ease;
        }

        .timeline-item:hover {
            background: #e3f2fd;
            transform: translateX(5px);
        }

        .timeline-time {
            min-width: 120px;
            font-weight: 600;
            color: #2c3e50;
        }

        .timeline-command {
            flex: 1;
            margin: 0 20px;
            color: #34495e;
        }

        .timeline-mode {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .mode-level { background: #e8f5e8; color: #27ae60; }
        .mode-vertical { background: #fff3cd; color: #f39c12; }
        .mode-construction { background: #f8d7da; color: #e74c3c; }
        .mode-stair { background: #d1ecf1; color: #17a2b8; }
        .mode-stepping { background: #e2e3e5; color: #6c757d; }
        .mode-sitting { background: #fce4ec; color: #e91e63; }
        .mode-standing { background: #f3e5f5; color: #9c27b0; }
        .mode-low { background: #fff8e1; color: #ff9800; }

        .command-type {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.7em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .type-clear { background: #d4edda; color: #155724; }
        .type-vague { background: #fff3cd; color: #856404; }
        .type-safety { background: #f8d7da; color: #721c24; }

        .data-table {
            padding: 30px;
            background: white;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #2c3e50;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .search-box:focus {
            outline: none;
            border-color: #3498db;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 12px;
            border: 1px solid #ecf0f1;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination button:hover {
            background: #3498db;
            color: white;
        }

        .pagination button.active {
            background: #3498db;
            color: white;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .charts-section {
                grid-template-columns: 1fr;
            }
            
            .filter-group {
                flex-direction: column;
                align-items: stretch;
            }
            
            .timeline-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚶 Locomotion Data Analysis Dashboard</h1>
            <p>Interactive analysis of locomotion commands and patterns</p>
        </div>

        <div class="stats-grid" id="statsGrid">
            <!-- Stats will be populated by JavaScript -->
        </div>

        <div class="controls">
            <div class="filter-group">
                <label>Locomotion Mode:</label>
                <select id="modeFilter">
                    <option value="">All Modes</option>
                </select>

                <label>Command Type:</label>
                <select id="typeFilter">
                    <option value="">All Types</option>
                    <option value="Clear">Clear</option>
                    <option value="Vague">Vague</option>
                    <option value="Safety-Critical">Safety-Critical</option>
                </select>

                <label>Time Range:</label>
                <input type="time" id="startTime" step="0.001">
                <input type="time" id="endTime" step="0.001">

                <button onclick="resetFilters()" style="padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer;">Reset Filters</button>
            </div>
        </div>

        <div class="charts-section">
            <div class="chart-container">
                <div class="chart-title">Locomotion Modes Distribution</div>
                <canvas id="modeChart"></canvas>
            </div>
            <div class="chart-container">
                <div class="chart-title">Command Types Distribution</div>
                <canvas id="typeChart"></canvas>
            </div>
        </div>

        <div class="charts-section">
            <div class="chart-container">
                <div class="chart-title">Timeline of Activities</div>
                <canvas id="timelineChart"></canvas>
            </div>
            <div class="chart-container">
                <div class="chart-title">Duration Analysis</div>
                <canvas id="durationChart"></canvas>
            </div>
        </div>

        <div class="timeline-section">
            <div class="chart-title">Activity Timeline</div>
            <div class="timeline-container" id="timelineContainer">
                <!-- Timeline items will be populated by JavaScript -->
            </div>
        </div>

        <div class="data-table">
            <div class="chart-title">Detailed Data Table</div>
            <input type="text" class="search-box" id="searchBox" placeholder="Search commands...">
            <div class="table-container">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Command</th>
                            <th>Type</th>
                            <th>Mode</th>
                            <th>Duration</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Table rows will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="pagination">
                <!-- Pagination will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        let data = [];
        let filteredData = [];
        let currentPage = 1;
        const itemsPerPage = 20;

        // Load data
        async function loadData() {
            try {
                const response = await fetch('data/data.json');
                data = await response.json();
                filteredData = [...data];
                initializeDashboard();
            } catch (error) {
                console.error('Error loading data:', error);
                // Fallback: create sample data structure
                data = [];
                filteredData = [];
                initializeDashboard();
            }
        }

        function initializeDashboard() {
            updateStats();
            updateCharts();
            updateTimeline();
            updateTable();
            populateFilters();
        }

        function updateStats() {
            const statsGrid = document.getElementById('statsGrid');
            const totalCommands = filteredData.length;
            const uniqueModes = new Set(filteredData.map(d => d.locomotion_mode)).size;
            const uniqueTypes = new Set(filteredData.map(d => d.command_type)).size;
            const avgDuration = calculateAverageDuration();

            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${totalCommands}</div>
                    <div class="stat-label">Total Commands</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${uniqueModes}</div>
                    <div class="stat-label">Unique Modes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${uniqueTypes}</div>
                    <div class="stat-label">Command Types</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${avgDuration.toFixed(2)}s</div>
                    <div class="stat-label">Avg Duration</div>
                </div>
            `;
        }

        function calculateAverageDuration() {
            if (filteredData.length === 0) return 0;
            
            const totalDuration = filteredData.reduce((sum, item) => {
                const start = parseTime(item.timestamp_start);
                const end = parseTime(item.timestamp_end);
                return sum + (end - start);
            }, 0);
            
            return totalDuration / filteredData.length;
        }

        function parseTime(timeStr) {
            const [hours, minutes, seconds] = timeStr.split(':').map(Number);
            return hours * 3600 + minutes * 60 + seconds;
        }

        function updateCharts() {
            updateModeChart();
            updateTypeChart();
            updateTimelineChart();
            updateDurationChart();
        }

        function updateModeChart() {
            const ctx = document.getElementById('modeChart').getContext('2d');
            
            const modeCounts = {};
            filteredData.forEach(item => {
                modeCounts[item.locomotion_mode] = (modeCounts[item.locomotion_mode] || 0) + 1;
            });

            const labels = Object.keys(modeCounts);
            const data = Object.values(modeCounts);

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#3498db', '#e74c3c', '#2ecc71', '#f39c12',
                            '#9b59b6', '#1abc9c', '#e67e22', '#34495e'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        function updateTypeChart() {
            const ctx = document.getElementById('typeChart').getContext('2d');
            
            const typeCounts = {};
            filteredData.forEach(item => {
                typeCounts[item.command_type] = (typeCounts[item.command_type] || 0) + 1;
            });

            const labels = Object.keys(typeCounts);
            const data = Object.values(typeCounts);

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Count',
                        data: data,
                        backgroundColor: ['#3498db', '#f39c12', '#e74c3c']
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function updateTimelineChart() {
            const ctx = document.getElementById('timelineChart').getContext('2d');
            
            // Group data by time intervals
            const timeData = {};
            filteredData.forEach(item => {
                const time = item.timestamp_start.split(':')[0] + ':' + item.timestamp_start.split(':')[1];
                timeData[time] = (timeData[time] || 0) + 1;
            });

            const labels = Object.keys(timeData).sort();
            const data = labels.map(label => timeData[label]);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Commands per Minute',
                        data: data,
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function updateDurationChart() {
            const ctx = document.getElementById('durationChart').getContext('2d');
            
            const durations = filteredData.map(item => {
                const start = parseTime(item.timestamp_start);
                const end = parseTime(item.timestamp_end);
                return end - start;
            });

            // Create duration bins
            const bins = [0, 1, 2, 3, 5, 10];
            const binCounts = new Array(bins.length - 1).fill(0);
            
            durations.forEach(duration => {
                for (let i = 0; i < bins.length - 1; i++) {
                    if (duration >= bins[i] && duration < bins[i + 1]) {
                        binCounts[i]++;
                        break;
                    }
                }
            });

            const labels = bins.slice(0, -1).map((bin, i) => `${bin}-${bins[i + 1]}s`);

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Duration Distribution',
                        data: binCounts,
                        backgroundColor: '#2ecc71'
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function updateTimeline() {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = '';

            filteredData.slice(0, 50).forEach(item => {
                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';
                
                const modeClass = getModeClass(item.locomotion_mode);
                const typeClass = getTypeClass(item.command_type);
                
                timelineItem.innerHTML = `
                    <div class="timeline-time">${item.timestamp_start}</div>
                    <div class="timeline-command">${item.command}</div>
                    <div class="timeline-mode ${modeClass}">${item.locomotion_mode}</div>
                    <div class="command-type ${typeClass}">${item.command_type}</div>
                `;
                
                container.appendChild(timelineItem);
            });
        }

        function getModeClass(mode) {
            if (mode.includes('Level-Ground')) return 'mode-level';
            if (mode.includes('Vertical')) return 'mode-vertical';
            if (mode.includes('Construction')) return 'mode-construction';
            if (mode.includes('Stair')) return 'mode-stair';
            if (mode.includes('Stepping')) return 'mode-stepping';
            if (mode.includes('Sitting')) return 'mode-sitting';
            if (mode.includes('Standing')) return 'mode-standing';
            if (mode.includes('Low Space')) return 'mode-low';
            return 'mode-level';
        }

        function getTypeClass(type) {
            if (type === 'Clear') return 'type-clear';
            if (type === 'Vague') return 'type-vague';
            if (type === 'Safety-Critical') return 'type-safety';
            return 'type-clear';
        }

        function updateTable() {
            const tableBody = document.getElementById('tableBody');
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = filteredData.slice(startIndex, endIndex);

            tableBody.innerHTML = '';

            pageData.forEach(item => {
                const row = document.createElement('tr');
                const duration = parseTime(item.timestamp_end) - parseTime(item.timestamp_start);
                
                row.innerHTML = `
                    <td>${item.timestamp_start}</td>
                    <td>${item.command}</td>
                    <td><span class="command-type ${getTypeClass(item.command_type)}">${item.command_type}</span></td>
                    <td><span class="timeline-mode ${getModeClass(item.locomotion_mode)}">${item.locomotion_mode}</span></td>
                    <td>${duration.toFixed(2)}s</td>
                `;
                
                tableBody.appendChild(row);
            });

            updatePagination();
        }

        function updatePagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            
            pagination.innerHTML = '';
            
            // Previous button
            const prevBtn = document.createElement('button');
            prevBtn.textContent = 'Previous';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => {
                if (currentPage > 1) {
                    currentPage--;
                    updateTable();
                }
            };
            pagination.appendChild(prevBtn);
            
            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    const pageBtn = document.createElement('button');
                    pageBtn.textContent = i;
                    pageBtn.className = i === currentPage ? 'active' : '';
                    pageBtn.onclick = () => {
                        currentPage = i;
                        updateTable();
                    };
                    pagination.appendChild(pageBtn);
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    const ellipsis = document.createElement('span');
                    ellipsis.textContent = '...';
                    ellipsis.style.padding = '8px 12px';
                    pagination.appendChild(ellipsis);
                }
            }
            
            // Next button
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    updateTable();
                }
            };
            pagination.appendChild(nextBtn);
        }

        function populateFilters() {
            const modeFilter = document.getElementById('modeFilter');
            const modes = [...new Set(data.map(d => d.locomotion_mode))];
            
            modes.forEach(mode => {
                const option = document.createElement('option');
                option.value = mode;
                option.textContent = mode;
                modeFilter.appendChild(option);
            });
        }

        function applyFilters() {
            const modeFilter = document.getElementById('modeFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();

            filteredData = data.filter(item => {
                // Mode filter
                if (modeFilter && item.locomotion_mode !== modeFilter) return false;
                
                // Type filter
                if (typeFilter && item.command_type !== typeFilter) return false;
                
                // Time filter
                if (startTime && item.timestamp_start < startTime) return false;
                if (endTime && item.timestamp_end > endTime) return false;
                
                // Search filter
                if (searchTerm && !item.command.toLowerCase().includes(searchTerm)) return false;
                
                return true;
            });

            currentPage = 1;
            updateStats();
            updateCharts();
            updateTimeline();
            updateTable();
        }

        function resetFilters() {
            document.getElementById('modeFilter').value = '';
            document.getElementById('typeFilter').value = '';
            document.getElementById('startTime').value = '';
            document.getElementById('endTime').value = '';
            document.getElementById('searchBox').value = '';
            
            filteredData = [...data];
            currentPage = 1;
            updateStats();
            updateCharts();
            updateTimeline();
            updateTable();
        }

        // Event listeners
        document.getElementById('modeFilter').addEventListener('change', applyFilters);
        document.getElementById('typeFilter').addEventListener('change', applyFilters);
        document.getElementById('startTime').addEventListener('change', applyFilters);
        document.getElementById('endTime').addEventListener('change', applyFilters);
        document.getElementById('searchBox').addEventListener('input', applyFilters);

        // Initialize dashboard
        loadData();
    </script>
</body>
</html>
